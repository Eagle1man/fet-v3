name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check src tests
      - name: Типы
        run: mypy src
      - name: Тесты
        run: pytest
