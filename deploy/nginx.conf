# Пример HTTPS-прокси к панели FET v3.
# Замените домен и пути сертификатов.

server {
    listen 80;
    server_name schedule.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name schedule.example.ru;

    ssl_certificate     /etc/letsencrypt/live/schedule.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schedule.example.ru/privkey.pem;

    client_max_body_size 20m;

    # API для сайта вуза: JS обращается к /schedule-api/... на своём домене
    location /schedule-api/ {
        proxy_pass http://127.0.0.1:8000/api/site/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
